{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <main class="container">
        <h1>Приветствие</h1>

        <form action="{% url 'greeting' %}" method="get" class="greeting-form">
            <label for="name">Твоё имя:</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ name }}"
                placeholder="Например, Али"
                required
            >
            <input
                type="text"
                id="number"
                name="number"
                value="{{ number }}"
                placeholder="Например, Али"
            >


            <button type="submit" class="button">
                Показать приветствие
            </button>
        </form>

        {% if name %}
            <p class="result">Привет, {{ name }}!</p>
        {% else %}
            <p>Введи имя и нажми кнопку.</p>
        {% endif %}
        {% if number %}
            <p class="result">Ваше число {{ number }}</p>
        {% endif %}
        <a href="{% url 'home' %}">На главную</a>
    </main>
</body>
</html>
