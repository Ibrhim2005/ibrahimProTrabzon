{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <main class="container">
        <h1>POST-форма</h1>

        <form
            action="{% url 'greeting' %}"
            method="post"
            class="greeting-form"
        >
            {% csrf_token %}

            <label for="name">Твоё имя:</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ name }}"
                placeholder="Например, Али"
                required
                minlength="2"
                maxlength="50"
            >
            <input
                type="text"
                id="city"
                name="city"
                value="{{ city }}"
                placeholder="Например, Trabzon"
                minlength="2"
                maxlength="50"
            >

            <button type="submit" class="button">
                Отправить
            </button>
        </form>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        {% if success %}
            <p class="result">Привет, {{ name }}!.Ваш город, {{ city }}</p>
        {% endif %}

        <a href="{% url 'home' %}">На главную</a>
    </main>
</body>
</html>
